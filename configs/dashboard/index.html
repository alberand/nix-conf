<!DOCTYPE html>
<html>
  <head>
    <title>alberand intranet dashboard</title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!-- General metatags -->
      <meta name="author" content="alberand">
      <meta name="description" content="alberand's network main dashboard">

      <!-- Open Graph tags -->
      <meta property="og:type" content="website">
      <meta property="og:url" content="https://home.alberand.com/">
      <meta property="og:description" content="alberand's network main dashboard">
      <style>
        :root {
          --gap-small: 5px;
          --gap-medium: 10px;
          --min-tile-size: 160px;
          --max-tile-size: 230px;
        }

        body {
          background-color: #282c35;
          font-family: Helvetica, Arial, Sans-Serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          margin: 0;
          max-width: 100vw;
        }

        main {
          max-width: calc(var(--min-tile-size)*3 + 2*var(--gap-medium));
          display: flex;
          flex-direction: row;
          flex-wrap: wrap;
          gap: var(--gap-medium);
          padding: var(--gap-small);
        }

        img {
          border-radius: 10px;
        }

        a {
          color: #c2c9d6;
        }

        .item {
          background-color: #343944;
          padding: var(--gap-small);
          border-radius: var(--gap-small);
          width: calc(var(--min-tile-size) - 2*var(--gap-small));
          min-width: calc(var(--min-tile-size) - 2*var(--gap-small));
          max-width: calc(var(--max-tile-size) - 2*var(--gap-small));
          height: auto;
          aspect-ratio: 1;
          align-content: center;
        }

        @media only screen and (max-width: 600px) {
          .item {
            width: calc((50vw - 2*var(--gap-small)) - var(--gap-medium));
          }
        }

        .item-link {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          height: var(100% - 2*var(--gap-small));
          gap: var(--gap-small);
          padding: var(--gap-small);
        }

        #local-stuff {
          width: 100%;
          color: #5e636e;
          font-size: 12px;
        }

        #local-stuff ul {
          margin: 0;
        }

        footer {
          width: 100%;
          text-align: center;
          font-size: 12px;
          color: #5e636e;
          padding: calc(var(--gap-small)*4) 0;
        }
      </style>
  </head>
  <body>
    <main>
      <div class="item">
        <a class="item-link" href="https://jellyfin.alberand.com">
            <img width=100 height=100 src="/static/jellyfin.png">
            Movies & Shows
        </a>
      </div>
      <div class="item">
        <a class="item-link" href="https://jellyseerr.alberand.com">
            <img width=100 height=100 src="/static/jellyseerr.png">
            Request a movie
        </a>
      </div>
      <div class="item">
        <a class="item-link" href="https://photos.alberand.com">
            <img width=100 height=100 src="/static/photoprism.png">
            Photos
        </a>
      </div>
      <div class="item">
        <a class="item-link" href="https://food.alberand.com">
            <img width=100 height=100 src="/static/mealie.png">
            Recipes & Food
        </a>
      </div>
      <div class="item">
        <a class="item-link" href="https://git.alberand.com">
            <img width=100 height=100 src="/static/forgejo.png">
            Git & Code
        </a>
      </div>
      <div class="item">
        <a class="item-link" href="https://photos.alberand.com/s/y9osf4whxn/san-ka">
            <img width=100 height=100 src="/static/sasha.jpg">
            Санька
        </a>
      </div>
      <div class="item">
        <a class="item-link" href="https://files.alberand.com/apps/files/files">
            <img width=100 height=100 src="/static/nextcloud.png">
            Nextcloud
        </a>
      </div>
      <div class="item">
        <a class="item-link" href="https://pdf.alberand.com">
            <img width=100 height=100 src="/static/stirling-pdf.png">
            PDF
        </a>
      </div>
            PDF
        </a>
      </div>
      <div id="local-stuff">
        @alberand local stuff
        <ul>
          <li>
            <a href="https://status.alberand.com">Status</a>
          </li>
          <li>
            <a href="http://deluge.containers:8112">Deluge</a>
          </li>
          <li>
            <a href="http://localhost:28981">Paperless</a>
          </li>
          <li>
            <a href="http://jellyfin.containers:7878">Radarr</a>
          </li>
          <li>
            <a href="http://jellyfin.containers:8989">Sonarr</a>
          </li>
          <li>
            <a href="http://jellyfin.containers:9117">Jackett</a>
          </li>
          <li>
            <a href="http://jellyfin.containers:8686">Lidarr</a>
          </li>
        </ul>
      </div>
    </main>
    <footer>
      Done by @alberand
    </footer>
  </body>
</html>
